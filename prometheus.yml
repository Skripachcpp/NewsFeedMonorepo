global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'newsfeed-monitor'

scrape_configs:
  - job_name: 'newsfeed-api'
    static_configs:
      - targets: ['newsfeed-api:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'newsfeed-auth-service'
    static_configs:
      - targets: ['newsfeed-auth-service:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s

